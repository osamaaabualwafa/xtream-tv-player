name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk xtream-tv-player.apk

      # Release title shows the app's version (from app/build.gradle.kts); the tag stays build-N,
      # which the in-app update compares by number.
      - name: Read version name
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Version ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          body: "Android TV APK. Direct link: https://github.com/${{ github.repository }}/releases/latest/download/xtream-tv-player.apk"
          files: xtream-tv-player.apk
          make_latest: true
