name: Weekly QA (Android TV)

# Every Wednesday 02:00 Riyadh time (= Tuesday 23:00 UTC): the full UI test suite on Android TV
# emulators (several in parallel) against a fake Xtream server (qa/server). Results: the
# "qa-report" artifact, the qa-report branch (latest report only) and the run summary.
on:
  schedule:
    - cron: '0 23 * * 2'
  workflow_dispatch:
    inputs:
      tests:
        description: 'Only these test classes, comma separated (e.g. com.osama.xtreamtv.qa.T03_LiveTvTest). Empty = all.'
        required: false
        default: ''
  push:
    branches: [weekly-qa]

permissions:
  contents: write

concurrency:
  group: weekly-qa
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python3 qa/shards.py "${{ github.event.inputs.tests }}" >> "$GITHUB_OUTPUT"

  tests:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      QA_TESTS: ${{ matrix.tests }}
      QA_MONKEY: ${{ matrix.monkey }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and the tests
        run: |
          chmod +x gradlew qa/run-on-emulator.sh
          env -u GITHUB_RUN_NUMBER ./gradlew assembleDebug assembleDebugAndroidTest -PbuildNumber=999999 --stacktrace

      - name: Start the fake Xtream server
        run: |
          bash qa/server/make_live_ts.sh
          nohup python3 qa/server/fake_xtream.py > qa-server.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8080/__health

      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tests on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash qa/run-on-emulator.sh

      - name: Keep this shard's results
        if: always()
        run: |
          mkdir -p qa-out
          cp qa-server.log qa-out/ 2>/dev/null || true
          echo "${{ matrix.shard }}" > qa-out/shard.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-out-${{ matrix.shard }}
          path: |
            qa-out
            !qa-out/video
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-video-${{ matrix.shard }}
          path: qa-out/video
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: qa-out-*
          path: qa-out

      - name: Build the report
        run: |
          python3 qa/make_report.py qa-out report "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: report
          retention-days: 30

      - name: Publish the latest report to the qa-report branch
        run: |
          cd report
          git init -q -b qa-report
          git config user.name "weekly-qa"
          git config user.email "weekly-qa@users.noreply.github.com"
          git add -A
          git commit -q -m "QA report $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-report

      - name: Mark the run red if tests failed or the app crashed
        run: |
          python3 -c "import json,sys; s=json.load(open('report/summary.json')); sys.exit(1 if s['totals']['failed'] or s['crashes'] or s['anrs'] or not s['totals']['tests'] else 0)"
